# ==============================================================================
# Custom Home Assistant Voice PE firmware — lealvona fork.
#
# Two dispatch paths with deliberately ASYMMETRIC resilience profiles:
#
#   Long-press → Research Asks
#     on_stt_end below tries the bridge proxy FIRST with a short (800ms)
#     timeout, then FALLS BACK to a direct POST to the research backend.
#     Research dispatch survives the bridge being down: failure routes
#     around the more-failure-prone bridge straight to the research backend.
#
#   Short-press / Wake-word → Quick Chat
#     The BRIDGE owns dispatch end-to-end: STT → local LLM → edge-tts → audio
#     URL playback back to the Voice PE. Quick Chat survives the cloud /
#     research backend being down (local LLM + local TTS), but requires the
#     bridge to be alive.
#     Double-press additionally arms a photo-augmented Quick Chat: the next
#     utterance triggers a 3-2-1 countdown TTS, a JPEG snapshot capture from
#     the configured CAMERA_SNAPSHOT_URL, and a multimodal LLM call.
#
# This asymmetry is INTENTIONAL — each path is matched to its workload's
# reliability vs. flexibility profile. See the research-bridge module
# docstring for the architectural rationale.
# ==============================================================================
substitutions:
  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'
  # Center-button capture modes — which dispatch the next STT result is routed to
  # by on_stt_end. Single press -> direct, double -> agent, triple -> agent+camera,
  # long press -> research. (See capture_mode global and on_multi_click.)
  capture_mode_none: '0'
  capture_mode_direct: '1'
  capture_mode_agent: '2'
  capture_mode_agent_photo: '3'
  capture_mode_research: '4'
  # Change this to true in case you ahve a hidden SSID at home.
  hidden_ssid: "false"
  # Internal research/quick-chat endpoints — values kept in gitignored secrets.yaml
  # so internal network topology is not committed to the public repo.
  quickchat_base: !secret quickchat_base
  bridge_base: !secret bridge_base
  research_base: !secret research_base
  # Substitutions for audio files
  jack_connected_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/jack_disconnected.flac
  mute_switch_on_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
  timer_finished_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  wake_word_triggered_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
  center_button_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_long_press.flac
  factory_reset_initiated_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/factory_reset_confirmed.mp3
  easter_egg_tick_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/easter_egg_tick.mp3
  easter_egg_tada_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/easter_egg_tada.mp3
  error_cloud_expired_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

esphome:
  name: home-assistant-voice
  friendly_name: Home Assistant Voice
  name_add_mac_suffix: true
  min_version: 2026.5.0
  # Non-blocking LAN dispatch helpers (research / quick-chat / camera POSTs run
  # on short-lived worker tasks so the main loop never stalls on the network).
  includes:
    - voice_dispatch.h
  on_boot:
    priority: 375
    then:
      # Run the script to refresh the LED status
      - script.execute: control_leds
      - delay: 1s
      - switch.turn_on: internal_speaker_amp
      # Force the transient "Stop" barge-in word OFF at boot. Its enabled state
      # persists to flash, so if a reboot/crash/OTA happened mid-answer (after
      # activate_stop_word_once enabled it but before it disabled it), "stop"
      # would otherwise come back as an always-on idle wake word. It is re-enabled
      # on demand at the start of every answer, so disabling here is safe.
      - micro_wake_word.disable_model: stop
      # If after 10 minutes, the device is still initializing (It did not yet connect to Home Assistant), turn off the init_in_progress variable and run the script to refresh the LED status
      - delay: 10min
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: control_leds

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

      # LWIP core locking fix — prevents music playback stuttering on some networks
      # See: https://github.com/esphome/home-assistant-voice-pe/issues/455
      CONFIG_LWIP_TCPIP_CORE_LOCKING: "n"

wifi:
  id: wifi_id
  domain: .local
  reboot_timeout: 15min
  power_save_mode: LIGHT
  enable_btm: false
  enable_rrm: false
  passive_scan: false
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 1
    - ssid: !secret wifi_ssid_5g
      password: !secret wifi_password
      priority: 0
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
    # Enable/disable Sendspin static adjustment delay if the jack is plugged in or not
    - if:
        condition:
          - binary_sensor.is_on: jack_plugged
        then:
          - sendspin.media_source.enable_static_delay_adjustment:
        else:
          - sendspin.media_source.disable_static_delay_adjustment:
  on_disconnect:
    - script.execute: control_leds

network:
  enable_ipv6: true

logger:
  level: DEBUG
  logs:
    sensor: WARN  # avoids logging debug sensor updates

api:
  id: api_id
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds
  # API encryption with a key the BRIDGE holds and Home Assistant does NOT. This is
  # what keeps the bridge the SOLE owner of the device: without the key no client
  # can connect at all, so HA can neither adopt the device nor drive its voice
  # pipeline — which was the source of the 2026-06-20 API contention + self-trigger
  # loop (two clients fighting over the voice-assistant session). The bridge connects
  # with this same key via VOICE_PE_API_PSK.
  # NOTE: this is the INVERSE of the 2026-06-19 lockout — back then HA SET its own
  # key on adoption and locked the bridge out; here WE set the key (firmware secret),
  # so HA is the one locked out, not the bridge. Do NOT remove without a plan to keep
  # HA off these devices another way.
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    id: ota_esphome

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false  # The VPE has PSRAM, so this is safe. Allows configuring WiFi driver to use more resources (done automatically by the speaker media player)

globals:
  # Global index for our LEDs. So that switching between different animation does not lead to unwanted effects.
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  # Consecutive 1s watchdog ticks during which the LEDs have shown a transient
  # (active) phase with no actual activity. Used to force the ring back to
  # idle/off so LEDs never run on past the end of a cycle (see the LED inactivity
  # watchdog interval).
  - id: led_idle_ticks
    type: int
    restore_value: no
    initial_value: '0'
  # Counts seconds of genuine inactivity for the long idle hard-reset watchdog.
  - id: idle_reset_ticks
    type: int
    restore_value: no
    initial_value: '0'
  # Global initialization variable. Initialized to true and set to false once everything is connected. Only used to have a smooth "plugging" experience
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing the state of ImprovBLE. Used to draw different LED animations
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the phase of the voice assistant (defined above). Initialized to not_ready
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # Global variable tracking if the dial was recently touched.
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the LED color was recently changed.
  - id: color_changed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the group media player volume was recent changed.
  - id: group_volume_changed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Center-button capture mode for the next STT result, set by the press handler:
  # 0=none, 1=direct LLM, 2=Hermes agent, 3=agent+camera, 4=research.
  # on_stt_end routes the transcript based on this value.
  - id: capture_mode
    type: int
    restore_value: no
    initial_value: '0'
  # True while waiting for the user's spoken local/cloud answer (the clarification
  # turn requested by the bridge). on_stt_end consumes it to tag the POST as a
  # follow-up so the bridge routes the original question to the chosen target.
  - id: awaiting_clarification
    type: bool
    restore_value: no
    initial_value: 'false'
  # The original question + mode captured when a clarification turn starts, so
  # the follow-up POST can re-send them. This makes the bridge's in-memory
  # pending state a fallback, not a hard dependency (survives a bridge restart
  # mid-clarification).
  - id: clarify_orig_text
    type: std::string
    restore_value: no
  - id: clarify_orig_mode
    type: int
    restore_value: no
    initial_value: '0'
  # Global variable tracking if a quick-chat answer is still pending. Keeps LEDs purple
  # after STT finishes until the receipt/final answer plays or timeout/error fires.
  - id: quick_chat_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  # millis() when quick_chat_pending last became true. The LED watchdog uses it
  # to hard-cap the spinning "thinking" phase so it can never get stuck on
  # forever if the answer never plays / the announcement count never completes.
  - id: quick_chat_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # True only during quick-chat announcement sequences (receipt + final answer).
  # Prevents research completion announcements from corrupting the count.
  - id: quick_chat_expecting_announcement
    type: bool
    restore_value: no
    initial_value: 'false'
  # Set by the center-button on_press when that press cancelled an active flow,
  # so the subsequent on_multi_click single-click does NOT then start a new turn.
  # Cleared at the top of every on_press, so it only ever reflects the current press.
  - id: cancel_press_consumed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Generation counter for quick-chat requests. Incremented on each button press.
  # The on_state handler only counts announcements matching the current generation,
  # so overlapping requests (pressing again before the first answer arrives) don't
  # corrupt each other's state.
  - id: quick_chat_generation
    type: int
    restore_value: no
    initial_value: '0'
  # The generation that was active when the current quick-chat STT ended.
  # If this doesn't match quick_chat_generation, the announcement is stale.
  - id: quick_chat_active_generation
    type: int
    restore_value: no
    initial_value: '0'
  # Count quick-chat announcements heard while quick_chat_pending is true:
  # 1 = receipt, 2 = final answer. Used to return LEDs to idle after final response.
  - id: quick_chat_announcement_count
    type: int
    restore_value: no
    initial_value: '0'
  # Global variable tracking if the jack has been plugged touched.
  - id: jack_plugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the jack has been unplugged touched.
  - id: jack_unplugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable storing the first active timer
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  # Global variable storing if a timer is active
  - id: is_timer_active
    type: bool
    restore_value: false
  # Global variable storing if a factory reset was requested. If it is set to true, the device will factory reset once the center button is released
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  # This is the master mute switch. It is exposed to Home Assistant. The user can only turn it on and off if the hardware switch is off. (The hardware switch overrides the software one)
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute
    entity_category: config
    lambda: |-
      // Muted either if the hardware mute switch is on or the microphone's software mute switch is enabled
      if (id(hardware_mute_switch).state || id(i2s_mics).get_mute_state()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute:
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute:
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds
  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Internal switch to track when a timer is ringing on the device.
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - script.execute: disable_repeat
      # Stop any current announcement (ie: stop the timer ring mid playback)
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              announcement: true
              id: external_media_player
      # Set back ducking ratio to zero
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      # Refresh the LED ring
      - script.execute: control_leds
    on_turn_on:
      # Duck audio
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      # Ring timer
      - script.execute: ring_timer
      # Refresh LED
      - script.execute: control_leds
      # If 15 minutes have passed and the timer is still ringing, stop it.
      - delay: 15min
      - switch.turn_off: timer_ringing
  - platform: gpio
    pin: GPIO47
    id: internal_speaker_amp
    name: "Internal speaker amp"
    entity_category: config
    restore_mode: ALWAYS_OFF
    internal: true

binary_sensor:
  # Center Button. Used for many things (See on_multi_click)
  - platform: gpio
    id: center_button
    pin:
      number: GPIO0
      inverted: true
    on_press:
      # UNIVERSAL CANCEL: any press during an active flow (listening / thinking /
      # responding / awaiting input) aborts everything AND tells the bridge to stop.
      # An idle press sets nothing here and falls through to on_multi_click to start.
      - lambda: |-
          id(cancel_press_consumed) = false;
          bool flow_active = id(quick_chat_pending) || id(awaiting_clarification)
                             || id(va).is_running()
                             || id(quick_chat_expecting_announcement);
          if (flow_active) {
            id(cancel_press_consumed) = true;
            id(quick_chat_generation) += 1;  // invalidate any in-flight result
            std::string body = "{\"source\":\"" + std::string(App.get_name().c_str()) +
                               "\",\"text\":\"stop\",\"barge\":true}";
            voice_dispatch::quickchat_post_async("${quickchat_base}/quick-chat", body, 1500,
                                                 id(quick_chat_generation));
            id(quick_chat_pending) = false;
            id(quick_chat_expecting_announcement) = false;
            id(quick_chat_announcement_count) = 0;
            id(awaiting_clarification) = false;
            id(capture_mode) = ${capture_mode_none};
            id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
            ESP_LOGI("cancel", "button cancel: aborting active flow + notifying bridge");
          }
      - if:
          condition:
            lambda: return id(cancel_press_consumed);
          then:
            - voice_assistant.stop:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - script.execute: control_leds
    on_release:
      - script.execute: control_leds
      # If a factory reset is requested, factory reset on release
      - if:
          condition:
            lambda: return id(factory_reset_requested);
          then:
            - button.press: factory_reset_button
    on_multi_click:
      # Simple Click:
      #   - Abort "things" in order
      #     - Timer
      #     - Announcements
      #     - Voice Assistant Pipeline run
      #     - Music
      #   - Starts the voice assistant if it is not yet running and if the device is not muted.
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - if:
                    condition:
                      switch.is_on: timer_ringing
                    then:
                      - switch.turn_off: timer_ringing
                    else:
                      - if:
                          condition:
                            voice_assistant.is_running:
                          then:
                            - voice_assistant.stop:
                          else:
                            - if:
                                condition:
                                  media_player.is_announcing:
                                    id: external_media_player
                                then:
                                  media_player.stop:
                                    announcement: true
                                    id: external_media_player
                                else:
                                  - if:
                                      condition:
                                        media_player.is_playing:
                                          id: external_media_player
                                      then:
                                        - media_player.pause:
                                            id: external_media_player
                                      else:
                                        - if:
                                            condition:
                                              and:
                                                - switch.is_off: master_mute_switch
                                                - not: voice_assistant.is_running
                                                - lambda: return id(va).get_api_connection() != nullptr;
                                                # Don't start a new turn if THIS press just cancelled an active flow.
                                                - lambda: return !id(cancel_press_consumed);
                                            then:
                                              - lambda: |-
                                                  ESP_LOGI("quick_chat", "single-press quick chat prompt; starting STT after prompt");
                                                  id(capture_mode) = ${capture_mode_direct};
                                                  id(quick_chat_pending) = false;
                                                  id(quick_chat_expecting_announcement) = false;
                                                  id(quick_chat_announcement_count) = 0;
                                                  id(quick_chat_generation) += 1;
                                                  id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
                                              - script.execute: control_leds
                                              - media_player.stop:
                                                  id: external_media_player
                                                  announcement: true
                                              - media_player.play_media:
                                                  id: external_media_player
                                                  media_url: "${quickchat_base}/quick-chat-static/quick_chat_prompt.mp3"
                                                  announcement: true
                                              # Wait for the prompt to actually START, then FINISH, before opening
                                              # the mic. A fixed delay alone raced the media fetch/buffer latency:
                                              # if the clip had not begun by the delay, `not is_announcing` was
                                              # already true and the mic opened over the prompt (the device then
                                              # transcribed its own prompt). Anchor on the real announcement
                                              # lifecycle instead.
                                              - wait_until:
                                                  condition:
                                                    media_player.is_announcing:
                                                      id: external_media_player
                                                  timeout: 3s
                                              - wait_until:
                                                  condition:
                                                    not:
                                                      media_player.is_announcing:
                                                        id: external_media_player
                                                  timeout: 8s
                                              - delay: 150ms
                                              - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
                                              - script.execute: control_leds
                                              - voice_assistant.start:
                                                  silence_detection: true
      # Double Click -> quick ask to the Hermes AGENT (tools / web search / skills).
      #   Plays the prompt, captures one spoken question, then on_stt_end posts it
      #   to the :6060 bridge with mode=agent. The bridge picks local vs cloud
      #   (inferred from the prompt, or asked). No Home Assistant event.
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - script.execute:
                    id: quick_capture
                    mode: ${capture_mode_agent}
                    prompt_url: "${quickchat_base}/quick-chat-static/quick_chat_prompt.mp3"
      # Triple Click -> Hermes AGENT + CAMERA. Same capture flow as double, but the
      #   bridge also grabs a camera still (with Coral detection hints) and sends it
      #   with the question to the multimodal agent. No Home Assistant event.
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - script.execute:
                    id: quick_capture
                    mode: ${capture_mode_agent_photo}
                    prompt_url: "${quickchat_base}/quick-chat-static/quick_chat_prompt.mp3"
      # Quadruple Click -> Home Assistant event only (placeholder for a future HA
      #   automation). Single/double/triple/long are all handled on-device through
      #   the bridges; ONLY the quad press is relegated to Home Assistant. Fires the
      #   legacy "triple_press" event type so any existing HA automation still works.
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - event.trigger:
                    id: button_press_event
                    event_type: "triple_press"
      # Long Press
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - light.turn_off: voice_assistant_leds
                - event.trigger:
                    id: button_press_event
                    event_type: "long_press"
                # Research capture: ask the prompt, then start one STT run. The
                # on_stt_end hook below posts the transcript to the research backend.
                - if:
                    condition:
                      and:
                        - switch.is_off: master_mute_switch
                        - not: voice_assistant.is_running
                        - lambda: return id(va).get_api_connection() != nullptr;
                    then:
                      - lambda: |-
                          ESP_LOGI("research_webhook", "long-press research mode armed; playing prompt");
                          id(capture_mode) = ${capture_mode_research};
                          id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
                      - script.execute: control_leds
                      - media_player.stop:
                          id: external_media_player
                          announcement: true
                      - media_player.play_media:
                          id: external_media_player
                          # Bridge-generated edge-tts clip (same voice as every other
                          # mode) instead of the old mechanical .115 research_prompt.mp3.
                          media_url: "${quickchat_base}/quick-chat-static/quick_chat_research_prompt.mp3"
                          announcement: true
                      # Wait for the prompt to actually START, then FINISH, before
                      # opening the mic (see single-press note).
                      - wait_until:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          timeout: 3s
                      - wait_until:
                          condition:
                            not:
                              media_player.is_announcing:
                                id: external_media_player
                          timeout: 10s
                      - delay: 300ms
                      - lambda: |-
                          ESP_LOGI("research_webhook", "prompt complete/timeout; starting research STT");
                          id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
                      - script.execute: control_leds
                      - voice_assistant.start:
                          silence_detection: true
                    else:
                      - lambda: |-
                          ESP_LOGW("research_webhook", "research long-press skipped: mute=%d running=%d voice_api_client=%d", id(master_mute_switch).state, id(va).is_running(), id(va).get_api_connection() != nullptr);
      # Very important do not remove. Trust me :D
      - timing:
          # H ....
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for at most 0.2s
          - OFF for 0.5s to 2s
          # A ._
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for 0.2s to 2s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress);
              then:
                - light.turn_on:
                    brightness: 100%
                    id: voice_assistant_leds
                    effect: "Tick"
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "easter_egg_tick_sound"
                - delay: 4s
                - light.turn_off: voice_assistant_leds
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "easter_egg_tada_sound"
                - light.turn_on:
                    brightness: 100%
                    id: voice_assistant_leds
                    effect: "Rainbow"
                - event.trigger:
                    id: button_press_event
                    event_type: "easter_egg_press"
      # Factory Reset Warning
      #  . Audible and Visible warning.
      - timing:
          - ON for at least 10s
        then:
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
                - light.turn_on:
                    brightness: 100%
                    id: voice_assistant_leds
                    effect: "Factory Reset Coming Up"
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_initiated_sound"
                - wait_until:
                    binary_sensor.is_off: center_button
                - if:
                    condition:
                      lambda: return !id(factory_reset_requested);
                    then:
                      - light.turn_off: voice_assistant_leds
                      - script.execute:
                          id: play_sound
                          priority: true
                          sound_file: "factory_reset_cancelled_sound"
      # Factory Reset Confirmed.
      #  . Audible warning to prompt user to release the button
      #  . Set factory_reset_requested to true
      - timing:
          - ON for at least 22s
        then:
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_confirmed_sound"
                - light.turn_on:
                    brightness: 100%
                    red: 100%
                    green: 0%
                    blue: 0%
                    id: voice_assistant_leds
                    effect: "none"
                - lambda: id(factory_reset_requested) = true;

  # Hardware mute switch (Side of the device)
  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin: GPIO3
    on_press:
      # Play mute on sound only if software mute isn't enabled
      - if:
          condition:
            - switch.is_off: master_mute_switch
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
    on_release:
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "mute_switch_off_sound"
      - microphone.unmute:
  # Audio Jack Plugged sensor
  - platform: gpio
    id: jack_plugged
    # Debouncing it a bit because it can be activated back and forth as you plug the audio jack
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    pin:
      number: GPIO17
    # When the jack is plugged in:
    #  - LED animation
    #  - Enable Sendspin static delay adjustment to apply the persisted delay when using the external audio output
    #  - Sound played
    on_press:
      - lambda: id(jack_plugged_recently) = true;
      - sendspin.media_source.enable_static_delay_adjustment:
      - script.execute: control_leds
      - delay: 200ms
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "jack_connected_sound"
      - delay: 800ms
      - lambda: id(jack_plugged_recently) = false;
      - script.execute: control_leds
    # When the jack is unplugged:
    #  - LED animation
    #  - Disable Sendspin static delay adjustment when using the internal speaker
    #  - Sound played
    on_release:
      - lambda: id(jack_unplugged_recently) = true;
      - script.execute: control_leds
      - sendspin.media_source.disable_static_delay_adjustment:
      - delay: 200ms
      - script.execute:
          id: play_sound
          priority: false
          sound_file: "jack_disconnected_sound"
      - delay: 800ms
      - lambda: id(jack_unplugged_recently) = false;
      - script.execute: control_leds

light:
  # Hardware LED ring. Not used because remapping needed
  - platform: esp32_rmt_led_strip
    id: leds_internal
    pin: GPIO21
    chipset: WS2812
    max_refresh_rate: 15ms
    num_leds: 12
    rgb_order: GRB
    rmt_symbols: 192
    default_transition_length: 0ms
    power_supply: led_power

  # Voice Assistant LED ring. Remapping of the internal LED.
  # This light is not exposed. The device controls it
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6
    effects:
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            id(global_led_animation_index) = (12 + id(global_led_animation_index) - 1) % 12;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == (id(global_led_animation_index)) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 1) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 2) % 12) {
                it[i] = color * 128;
              } else if (i == ( id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == ( id(global_led_animation_index) + 7) % 12) {
                it[i] = color * 192;
              } else if (i == ( id(global_led_animation_index) + 8) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Muted or Silent"
          update_interval: 16ms
          lambda: |-
            static int8_t index = 0;
            Color muted_color(255, 0, 0);
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if ( light_color.get_state() ) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if ( id(master_mute_switch).state ) {
              it[2] = Color::BLACK;
              it[3] = muted_color;
              it[4] = Color::BLACK;
              it[8] = Color::BLACK;
              it[9] = muted_color;
              it[10] = Color::BLACK;
            }
            if ( id(external_media_player).volume == 0.0f || id(external_media_player).is_muted() ) {
              it[5] = Color::BLACK;
              it[6] = muted_color;
              it[7] = Color::BLACK;
            }
      - addressable_lambda:
          name: "Voice kit startup failed"
          # update_interval: 16ms
          lambda: |-
            static int8_t index = 0;
            Color fail_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              if (i % 3) {
                it[i] = Color::BLACK;
              } else {
                it[i] = fail_color;
              }
            }
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color silenced_color(255, 0, 0);
            auto volume_ratio = 12.0f * id(external_media_player).volume;
            for (uint8_t i = 0; i < 12; i++) {
              if (i <= volume_ratio) {
                it[(6+i)%12] = color * min( 255.0f * (volume_ratio - i) , 255.0f ) ;
              } else {
                it[(6+i)%12] = Color::BLACK;
              }
            }
            if (id(external_media_player).volume == 0.0f) {
              it[6] = silenced_color;
            }
      - addressable_lambda:
          name: "Center Button Touched"
          update_interval: 16ms
          lambda: |-
            if (initial_run) {
              // set voice_assistant_leds light to colors based on led_ring
              auto led_ring_cv = id(led_ring).current_values;
              auto va_leds_call = id(voice_assistant_leds).make_call();
              va_leds_call.from_light_color_values(led_ring_cv);
              va_leds_call.set_brightness( min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f ) );
              va_leds_call.set_state(true);
              va_leds_call.perform();
            }
            auto light_color = id(voice_assistant_leds).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color;
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      - addressable_lambda:
          name: "Error"
          # Slow red breathing effect; avoid harsh flashing.
          update_interval: 60ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 30;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Timer Ring"
          # Slow breathing effect for spoken audio; avoid harsh flashing.
          update_interval: 40ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 50;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color muted_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if ( id(master_mute_switch).state ) {
              it[3] = muted_color;
              it[9] = muted_color;
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Timer Tick"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color muted_color(255, 0, 0);
            auto timer_ratio = 12.0f * id(first_active_timer).seconds_left / max(id(first_active_timer).total_seconds , static_cast<uint32_t>(1));
            uint8_t last_led_on = static_cast<uint8_t>(ceil(timer_ratio)) - 1;
            for (uint8_t i = 0; i < 12; i++) {
              float brightness_dip = ( i == id(global_led_animation_index) % 12 && i != last_led_on ) ? 0.9f : 1.0f ;
              if (i <= timer_ratio) {
                it[i] = color * min(255.0f * brightness_dip * (timer_ratio - i) , 255.0f * brightness_dip) ;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (id(master_mute_switch).state) {
              it[2] = Color::BLACK;
              it[3] = muted_color;
              it[4] = Color::BLACK;
              it[8] = Color::BLACK;
              it[9] = muted_color;
              it[10] = Color::BLACK;
            }
            id(global_led_animation_index) = (12 + id(global_led_animation_index) - 1) % 12;
      - addressable_rainbow:
          name: "Rainbow"
          width: 12
      - addressable_lambda:
          name: "Tick"
          update_interval: 333ms
          lambda: |-
            static uint8_t index = 0;
            Color color(255, 0, 0);
            if (initial_run) {
              index = 0;
            }
            for (uint8_t i = 0; i < 12; i++) {
              if (i <= index ) {
                it[i] = Color::BLACK;
              } else {
                it[i] = color;
              }
            }
            index = (index + 1) % 12;
      - addressable_lambda:
          name: "Factory Reset Coming Up"
          update_interval: 1s
          lambda: |-
            static uint8_t index = 0;
            Color color(255, 0, 0);
            if (initial_run) {
              index = 0;
            }
            for (uint8_t i = 0; i < 12; i++) {
              if (i <= index ) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 12;
      - addressable_lambda:
          name: "Jack Plugged"
          update_interval: 40ms
          lambda: |-
              static uint8_t index = 0;
              if (initial_run) {
                index = 0;
              }
              auto light_color = id(led_ring).current_values;
              Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                    light_color.get_blue() * 255);
              if (index <= 6) {
                for (uint8_t i = 0; i < 12; i++) {
                  if (i == index) {
                    it[i] = color;
                  } else if (i == (12 - index) % 12) {
                    it[i] = color;
                  } else {
                    it[i] = Color::BLACK;
                  }
                }
              }
              index = (index + 1);
      - addressable_lambda:
          name: "Jack Unplugged"
          update_interval: 40ms
          lambda: |-
              static uint8_t index = 0;
              if (initial_run) {
                index = 0;
              }
              auto light_color = id(led_ring).current_values;
              Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                    light_color.get_blue() * 255);
              if (index <= 6) {
                for (uint8_t i = 0; i < 12; i++) {
                  if (i == 6 - index) {
                    it[i] = color;
                  } else if (i == (6 + index) % 12) {
                    it[i] = color;
                  } else {
                    it[i] = Color::BLACK;
                  }
                }
              }
              index = (index + 1);

  # User facing LED ring. Remapping of the internal LEDs.
  # Exposed to be used by the user.
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6

power_supply:
  - id: led_power
    pin: GPIO45

sensor:
  # The dial. Used to control volume and Hue of the LED ring.
  - platform: rotary_encoder
    id: dial
    pin_a: GPIO16
    pin_b: GPIO18
    resolution: 2
    on_clockwise:
      - lambda: id(dial_touched) = true;
      - if:
          condition:
            binary_sensor.is_off: center_button
          then:
            - script.execute:
                id: control_volume
                increase_volume: true
          else:
            - if:
                condition:
                  media_player.is_playing:
                    id: sendspin_group_media_player
                then:
                  - script.execute:
                      id: control_group_volume
                      increase_volume: true
                else:
                  - script.execute:
                      id: control_hue
                      increase_hue: true
    on_anticlockwise:
      - lambda: id(dial_touched) = true;
      - if:
          condition:
            binary_sensor.is_off: center_button
          then:
            - script.execute:
                id: control_volume
                increase_volume: false
          else:
            - if:
                condition:
                  media_player.is_playing:
                    id: sendspin_group_media_player
                then:
                  - script.execute:
                      id: control_group_volume
                      increase_volume: false
                else:
                  - script.execute:
                      id: control_hue
                      increase_hue: false

event:
  # Event entity exposed to the user to automate on complex center button presses.
  # The simple press is not exposed as it is used to control the device itself.
  - platform: template
    id: button_press_event
    name: "Button press"
    icon: mdi:button-pointer
    device_class: button
    event_types:
      - double_press
      - triple_press
      - long_press
      - easter_egg_press

script:
  - id: quick_chat_timeout
    mode: restart
    then:
      - delay: 90s
      - if:
          condition:
            lambda: return id(quick_chat_pending);
          then:
            - lambda: ESP_LOGW("quick_chat", "quick chat timed out waiting for final response; showing LED error");
            - script.execute: quick_chat_show_error

  # Reset quick-chat state, flash the error LED, then return to idle after a
  # short dwell. Shared by the 90s response timeout and the (async) POST-failure
  # path so both clear state identically and neither leaves the error LED stuck.
  # The idle reset is guarded so a new quick-chat started during the dwell is not
  # stomped.
  - id: quick_chat_show_error
    mode: restart
    then:
      - lambda: |-
          id(quick_chat_pending) = false;
          id(quick_chat_expecting_announcement) = false;
          id(quick_chat_announcement_count) = 0;
          id(voice_assistant_phase) = ${voice_assist_error_phase_id};
      - script.execute: control_leds
      - delay: 3s
      - if:
          condition:
            lambda: 'return id(voice_assistant_phase) == ${voice_assist_error_phase_id};'
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            - script.execute: control_leds

  # Arm a quick-ask capture: set the dispatch mode, play a prompt, then start one
  # STT run. Shared by double-press (agent) and triple-press (agent+camera).
  # on_stt_end reads capture_mode and posts the transcript to the :6060 bridge.
  # Mirrors the single-press quick-chat arm in on_multi_click.
  - id: quick_capture
    parameters:
      mode: int
      prompt_url: string
    then:
      - if:
          condition:
            and:
              - switch.is_off: master_mute_switch
              - not: voice_assistant.is_running
              - lambda: return id(va).get_api_connection() != nullptr;
          then:
            - lambda: |-
                id(capture_mode) = mode;
                id(quick_chat_pending) = false;
                id(quick_chat_expecting_announcement) = false;
                id(quick_chat_announcement_count) = 0;
                id(quick_chat_generation) += 1;
                id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
            - script.execute: control_leds
            - media_player.stop:
                id: external_media_player
                announcement: true
            - media_player.play_media:
                id: external_media_player
                media_url: !lambda return prompt_url;
                announcement: true
            # Wait for the prompt to actually START, then FINISH, before opening the
            # mic (see single-press note): a fixed delay alone raced the media
            # fetch/buffer latency and let the mic open over the prompt.
            - wait_until:
                condition:
                  media_player.is_announcing:
                    id: external_media_player
                timeout: 3s
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing:
                      id: external_media_player
                timeout: 8s
            - delay: 150ms
            - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
            - script.execute: control_leds
            - voice_assistant.start:
                silence_detection: true
          else:
            - lambda: 'ESP_LOGW("quick_chat", "quick_capture mode %d skipped (mute/running/no-api)", mode);'

  # Master script controlling the LEDs, based on different conditions : initialization in progress, wifi and api connected and voice assistant phase.
  # For the sake of simplicity and re-usability, the script calls child scripts defined below.
  # This script will be called every time one of these conditions is changing.
  - id: control_leds
    then:
      - lambda: |
          if (id(voice_kit_component).is_failed()) {
            id(control_leds_voice_kit_startup_failed).execute();
            return;
          }
          id(check_if_timers_active).execute();
          if (id(is_timer_active)){
            id(fetch_first_active_timer).execute();
          }
          if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected() || !id(api_id).is_connected()){
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(center_button).state) {
            id(control_leds_center_button_touched).execute();
          } else if (id(jack_plugged_recently)) {
            id(control_leds_jack_plugged_recently).execute();
          } else if (id(jack_unplugged_recently)) {
            id(control_leds_jack_unplugged_recently).execute();
          } else if (id(dial_touched)) {
            id(control_leds_dial_touched).execute();
          } else if (id(timer_ringing).state) {
            id(control_leds_timer_ringing).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(is_timer_active)) {
            id(control_leds_timer_ticking).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }

  # Script executed if voice_kit startup failed
  # Static red "X"
  - id: control_leds_voice_kit_startup_failed
    then:
      - light.turn_on:
          brightness: 40%
          red: 0%
          green: 0%
          blue: 0%
          id: voice_assistant_leds
          effect: "Voice kit startup failed"

  # Script executed during Improv BLE
  # Warm White Twinkle
  - id: control_leds_improv_ble_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 89%
          blue: 71%
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed during initialization
  # Blue Twinkle if Wifi is connected, Else solid warm white
  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 66%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  # Script executed when the device has no connection to Home Assistant
  # Red Twinkle (This will be visible during HA updates for example)
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the voice assistant is idle (waiting for a wake word)
  # Nothing (Either LED ring off or LED ring on if the user decided to turn the user facing LED ring on)
  - id: control_leds_voice_assistant_idle_phase
    then:
      - light.turn_off: voice_assistant_leds
      - if:
          condition:
            light.is_on: led_ring
          then:
            light.turn_on: led_ring

  # Script executed when the voice assistant is waiting for a command (after prompt/wake)
  # Amber steady: wake word triggered, waiting for user to speak.
  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.35f );
          red: 100%
          green: 60%
          blue: 0%
          id: voice_assistant_leds
          effect: "none"

  # Script executed when the voice assistant is listening to a command
  # Green solid (quick-chat) or cyan solid (research) — recording/speech capture.
  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - if:
          condition:
            lambda: return id(capture_mode) == ${capture_mode_research};
          then:
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.45f );
                red: 0%
                green: 90%
                blue: 80%
                id: voice_assistant_leds
                effect: "none"
          else:
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.45f );
                red: 0%
                green: 100%
                blue: 0%
                id: voice_assistant_leds
                effect: "none"

  # Script executed when the voice assistant is thinking/awaiting Hermes.
  # Purple spin (quick-chat) or magenta pulse (research): waiting for response or error.
  - id: control_leds_voice_assistant_thinking_phase
    then:
      - if:
          condition:
            lambda: return id(capture_mode) == ${capture_mode_research};
          then:
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.35f );
                red: 100%
                green: 0%
                blue: 70%
                id: voice_assistant_leds
                effect: "Thinking"
          else:
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.35f );
                red: 55%
                green: 0%
                blue: 100%
                id: voice_assistant_leds
                effect: "Waiting for Command"

  # Script executed when the device is talking.
  # Pulsing blue for prompt, receipt, and final spoken response.
  - id: control_leds_voice_assistant_replying_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.35f );
          red: 0%
          green: 30%
          blue: 100%
          id: voice_assistant_leds
          effect: "Timer Ring"

  # Script executed when the voice assistant is in error
  # Fast Red Pulse
  - id: control_leds_voice_assistant_error_phase
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Error"

  # Script executed when the voice assistant is muted or silent
  # The LED next to the 2 microphones turn red / one red LED next to the speaker grill
  - id: control_leds_muted_or_silent
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Muted or Silent"

  # Script executed when the voice assistant is not ready
  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the dial is touched
  # A number of LEDs turn on indicating a visual representation of the volume of the media player entity.
  - id: control_leds_dial_touched
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Volume Display"

  # Script executed when the jack has just been unplugged
  # A ripple effect
  - id: control_leds_jack_unplugged_recently
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Jack Unplugged"

  # Script executed when the jack has just been plugged
  # A ripple effect
  - id: control_leds_jack_plugged_recently
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Jack Plugged"

  # Script executed when the center button is touched
  # The complete LED ring turns on
  - id: control_leds_center_button_touched
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Center Button Touched"

  # Script executed when the timer is ringing, to control the LEDs
  # The LED ring blinks.
  - id: control_leds_timer_ringing
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Timer Ring"

  # Script executed when the timer is ticking, to control the LEDs
  # The LEDs shows the remaining time as a fraction of the full ring.
  - id: control_leds_timer_ticking
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Timer tick"

  # Script executed when the volume is increased/decreased from the dial
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool  # True: Increase volume / False: Decrease volume.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up:
                id: external_media_player
          else:
            - media_player.volume_down:
                id: external_media_player
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds

  # Script executed when the volume is increased/decreased from the dial for the group media player
  - id: control_group_volume
    mode: restart
    parameters:
      increase_volume: bool  # True: Increase volume / False: Decrease volume.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - lambda: id(group_volume_changed) = true;
            - media_player.volume_up:
                id: sendspin_group_media_player
          else:
            - lambda: id(group_volume_changed) = true;
            - media_player.volume_down:
                id: sendspin_group_media_player
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(dial_touched) = false;
      - lambda: id(group_volume_changed) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds

  # Script executed when the hue is increased/decreased from the dial
  - id: control_hue
    mode: restart
    parameters:
      increase_hue: bool  # True: Increase hue / False: Decrease hue.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return(abs(int(id(dial).state)) > 3 || id(color_changed));
          then:
            - lambda: |
                id(color_changed) = true;
                auto light_color = id(voice_assistant_leds).current_values;
                int hue = 0;
                float saturation = 0;
                float value = 0;
                rgb_to_hsv( light_color.get_red(),
                            light_color.get_green(),
                            light_color.get_blue(),
                            hue,
                            saturation,
                            value);
                if (increase_hue) {
                  hue = (hue + 10) % 360;
                } else {
                  hue = (hue + 350) % 360;
                }
                if (saturation < 0.05) {
                  saturation = 1;
                }
                float red = 0;
                float green = 0;
                float blue = 0;
                hsv_to_rgb( hue,
                            saturation,
                            value,
                            red,
                            green,
                            blue);
                id(voice_assistant_leds).make_call().set_rgb(red, green, blue).perform();
      - wait_until:
          binary_sensor.is_off: center_button
      - lambda: |
          id(dial_touched) = false;
          // now we "save" the new LED color/state to led_ring, maintaining its brightness and state
          auto led_ring_call = id(led_ring).make_call();
          auto va_leds_cv = id(voice_assistant_leds).current_values;
          led_ring_call.from_light_color_values(va_leds_cv);
          led_ring_call.set_brightness(id(led_ring).current_values.get_brightness());
          led_ring_call.set_state(id(led_ring).current_values.is_on());
          led_ring_call.perform();
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds
      - delay: 500ms
      - lambda: id(color_changed) = false;

  # Script executed when the timer is ringing, to playback sounds.
  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"

  # Script executed when the timer is ringing, to repeat the timer finished sound.
  - id: enable_repeat_one
    then:
      # Turn on the repeat mode and pause for 500 ms between playlist items/repeats
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms

  # Script execute when the timer is done ringing, to disable repeat mode.
  - id: disable_repeat
    then:
      # Turn off the repeat mode and pause for 0 ms between playlist items/repeats
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms

  # Script executed when we want to play sounds on the device.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

  # Script used to fetch the first active timer (Stored in global first_active_timer)
  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  # Script used to check if a timer is active (Stored in global is_timer_active)
  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(is_timer_active) = output;

  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_once
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 5s
      - delay: 1s
      # Enable the transient "Stop" barge-in word for the rest of the answer
      # playback, then disable it again so it isn't an always-on word. The 1s
      # delay above skips the answer's opening word — the announcement channel
      # is NOT ducked and the XU316 AEC doesn't cancel the device's own TTS, so
      # the model hears the answer at full volume; the delay + a distinctive
      # word keep self-triggering low.
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            # Bounded wait so disable_model ALWAYS runs even if the announcing
            # state never clears (a clip that never finishes, a lost event) —
            # otherwise the stop word could be left enabled. on_boot also disables
            # it as a backstop against a reboot inside this window.
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing:
                      id: external_media_player
                timeout: 60s
            - micro_wake_word.disable_model: stop

i2s_audio:
  - id: i2s_output
    # i2s_output data pin is gpio10
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8

  - id: i2s_input
    # data line is GPIO15
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3204_dac

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

audio_file:
  - id: center_button_press_sound
    file: ${center_button_press_sound_file}
  - id: center_button_double_press_sound
    file: ${center_button_double_press_sound_file}
  - id: center_button_triple_press_sound
    file: ${center_button_triple_press_sound_file}
  - id: center_button_long_press_sound
    file: ${center_button_long_press_sound_file}
  - id: factory_reset_initiated_sound
    file: ${factory_reset_initiated_sound_file}
  - id: factory_reset_cancelled_sound
    file: ${factory_reset_cancelled_sound_file}
  - id: factory_reset_confirmed_sound
    file: ${factory_reset_confirmed_sound_file}
  - id: jack_connected_sound
    file: ${jack_connected_sound_file}
  - id: jack_disconnected_sound
    file: ${jack_disconnected_sound_file}
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}
  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}
  - id: timer_finished_sound
    file: ${timer_finished_sound_file}
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  - id: easter_egg_tick_sound
    file: ${easter_egg_tick_sound_file}
  - id: easter_egg_tada_sound
    file: ${easter_egg_tada_sound_file}
  - id: error_cloud_expired
    file: ${error_cloud_expired_sound_file}

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source
    fixed_delay: 480 microseconds  # The AIC3204 DAC used, as configured, on the VPE delays audio by 480 microseconds

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    on_mute:
      - script.execute: control_leds
    on_unmute:
      - script.execute: control_leds
    on_volume:
      - script.execute: control_leds
    on_announcement:
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
            - script.execute: control_leds
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            and:
              - lambda: return id(quick_chat_pending) && id(quick_chat_expecting_announcement) && id(quick_chat_active_generation) == id(quick_chat_generation) && (id(voice_assistant_phase) == ${voice_assist_replying_phase_id} || id(voice_assistant_phase) == ${voice_assist_thinking_phase_id});
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - lambda: |-
                id(quick_chat_announcement_count) += 1;
                ESP_LOGI("quick_chat", "quick-chat announcement finished count=%d", id(quick_chat_announcement_count));
                if (id(quick_chat_announcement_count) >= 2) {
                  id(quick_chat_pending) = false;
                  id(quick_chat_expecting_announcement) = false;
                  id(quick_chat_announcement_count) = 0;
                  id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
                } else {
                  id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
                }
            - script.execute: control_leds
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s

voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  reset_pin: GPIO4
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: "1.3.1"
    md5: 964635c5bf125529dab14a2472a15401

# Sendspin related components are pinned to specific commits for reproducible builds
external_components:
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: dev
    components:
      - voice_kit
    refresh: 0s

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    # Wake-mic gain. 4x was far too hot -> the wake models false-triggered on
    # ambient/TV/movie dialogue, self-activating the device. Halved to cut the
    # false-positive rate while keeping a deliberate nearby wake audible. Tunable.
    gain_factor: 2
  stop_after_detection: false
  models:
    - model: https://raw.githubusercontent.com/TaterTotterson/microWakeWords/main/microWakeWordsV3/hey_computer.json
      id: hey_computer
    - model: https://raw.githubusercontent.com/TaterTotterson/microWakeWords/main/microWakeWordsV3/ok_computer.json
      id: ok_computer
    - model: https://raw.githubusercontent.com/andrew-transparent/carson-wake-words/main/mister_carson.json
      id: mister_carson
    - model: https://raw.githubusercontent.com/TaterTotterson/microWakeWords/main/microWakeWords/janet.json
      id: janet
    # Transient "Stop" barge-in word. Disabled by default (only model index 0 is
    # enabled on boot; state persists to flash) and kept out of the user-facing
    # wake-word UI via internal:true. activate_stop_word_once enables it ONLY
    # while the device is speaking an answer, so saying "stop" cuts off the reply.
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                            # Barge-in: the user said "stop" (or a wake word)
                            # while an answer was playing. Stopping the audio is
                            # local (above); also tell the :6060 bridge to TERMINATE
                            # so it bumps its generation and suppresses the pending
                            # continue re-arm. BUT only when a quick-chat is actually
                            # in flight (receipt/thinking/answer) — guarded by
                            # quick_chat_pending — so interrupting a non-chat
                            # announcement (research prompt, wake greeting) doesn't
                            # fire a spurious barge-cancel. Dead stop.
                            - if:
                                condition:
                                  lambda: return id(quick_chat_pending);
                                then:
                                  - lambda: |-
                                      std::string body = "{\"source\":\"" + std::string(App.get_name().c_str()) +
                                                         "\",\"text\":\"stop\",\"barge\":true}";
                                      voice_dispatch::quickchat_post_async("${quickchat_base}/quick-chat", body, 1500,
                                                                           id(quick_chat_generation));
                          # Start the voice assistant. When wake_sound is on,
                          # play a context-relevant verbal greeting served by
                          # the bridge ("Yes?") instead of the generic chime —
                          # this signals the user that the wake-word Quick Chat
                          # path is active, distinct from the long-press
                          # research_started prompt. The chime is preserved as
                          # the fallback if the bridge audio file is unavailable
                          # (media_player.play_media is best-effort).
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - media_player.stop:
                                      id: external_media_player
                                      announcement: true
                                  - media_player.play_media:
                                      id: external_media_player
                                      media_url: "${quickchat_base}/quick-chat-static/quick_chat_wake.mp3"
                                      announcement: true
                                  # Wait for the greeting to actually START, then FINISH,
                                  # before opening the mic (see single-press note).
                                  - wait_until:
                                      condition:
                                        media_player.is_announcing:
                                          id: external_media_player
                                      timeout: 3s
                                  - wait_until:
                                      condition:
                                        not:
                                          media_player.is_announcing:
                                            id: external_media_player
                                      timeout: 2500ms
                            # Wake-word quick chat uses the direct-LLM path (same
                            # as a single press); on_stt_end reads capture_mode.
                            - lambda: |-
                                id(capture_mode) = ${capture_mode_direct};
                                // A wake word is a deliberate new "open" (like a button
                                // press), so clear any lingering cancel-suppression. Without
                                // this, a prior button-cancel leaves cancel_press_consumed
                                // set (only on_press clears it) and the on_start guard aborts
                                // EVERY wake run at birth (device-stop-aborted, 0 bytes).
                                id(cancel_press_consumed) = false;
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;
                                silence_detection: true

select:
  - platform: template
    name: "Wake word sensitivity"
    id: wake_word_sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Dynamic/community wake-word models do not share the calibrated cutoff
      # values that the stock firmware used for okay_nabu / hey_jarvis /
      # hey_mycroft. Keep the UI entity for compatibility, but do not reference
      # hard-coded model IDs that may not be present in a per-device build.
      - logger.log:
          tag: voice_assistant
          level: INFO
          format: "Wake word sensitivity preset selected: %s; custom models keep their model defaults"
          args: ["x.c_str()"]

# Surface a failed quick-chat POST on the main loop. The POST runs on a worker
# task (voice_dispatch.h); on failure it tags an atomic with its generation,
# which this interval polls. We act only if the failure belongs to the live
# quick-chat generation, so a superseded press can't disturb the current
# session. All LED/state changes happen here, on the main loop.
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              int g = voice_dispatch::take_quickchat_failure_gen();
              return g >= 0 && g == id(quick_chat_generation);
          then:
            - lambda: ESP_LOGW("quick_chat", "quick-chat POST failed; showing LED error");
            - script.execute: quick_chat_show_error
      # Clarification turn: the bridge couldn't tell local vs cloud from the
      # prompt and asked us (via {"status":"clarify"}) to capture a spoken
      # local/cloud answer. Re-arm STT with the "Local, or cloud?" prompt; the
      # next on_stt_end tags the POST clarify_followup so the bridge routes the
      # original question. Only acts on the live generation.
      - if:
          condition:
            lambda: |-
              // Peek (don't consume) so we only claim the clarify once we can
              // actually re-arm STT this tick — otherwise the signal would be
              // lost with awaiting_clarification stranded true. If not ready
              // (VA still stopping, muted, no API), leave it pending and retry
              // next tick. quick_capture re-checks the same guard, and the main
              // loop is single-threaded, so a pass here means it will arm.
              if (voice_dispatch::peek_quickchat_clarify_gen() != id(quick_chat_generation)) return false;
              if (id(master_mute_switch).state || id(va).is_running() ||
                  id(va).get_api_connection() == nullptr) return false;
              voice_dispatch::take_quickchat_clarify_gen();  // consume; we will arm now
              return true;
          then:
            - lambda: |-
                ESP_LOGI("quick_chat", "bridge requested local/cloud clarification; re-arming STT");
                id(awaiting_clarification) = true;
            - script.execute:
                id: quick_capture
                mode: ${capture_mode_direct}
                prompt_url: "${quickchat_base}/quick-chat-static/quick_chat_clarify.mp3"

  # LED inactivity watchdog: the LED state machine is event-driven, so a transient
  # phase (waiting/listening/thinking/replying/error) can linger if its clearing
  # event is missed. If we are in such a phase but nothing is actually happening
  # (no VA run, no pending ask, no playback/announcement, no timer, no button/dial)
  # for a few seconds, force the ring back to idle so the LEDs never run on with
  # no activity.
  - interval: 1s
    then:
      - lambda: |-
          int p = id(voice_assistant_phase);
          bool transient = (p == ${voice_assist_waiting_for_command_phase_id} ||
                            p == ${voice_assist_listening_for_command_phase_id} ||
                            p == ${voice_assist_thinking_phase_id} ||
                            p == ${voice_assist_replying_phase_id} ||
                            p == ${voice_assist_error_phase_id});
          if (!transient) { id(led_idle_ticks) = 0; return; }
          bool media_busy = id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING
                         || id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          // Hard cap on the spinning "thinking" phase. The announcement counter
          // that normally clears it assumes exactly 2 announcements; an empty
          // reply (no answer), a failed search, or extra progress cues can leave
          // quick_chat_pending stuck true and the ring spinning forever. If it's
          // been pending too long and nothing is actually playing, force idle.
          bool pending_fresh = id(quick_chat_pending) && (millis() - id(quick_chat_pending_since) < 22000);
          if (id(quick_chat_pending) && !pending_fresh && !media_busy) {
            ESP_LOGW("led_watchdog", "quick-chat thinking exceeded cap; clearing stuck spinner");
            id(quick_chat_pending) = false;
            id(quick_chat_expecting_announcement) = false;
            id(quick_chat_announcement_count) = 0;
            id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            id(led_idle_ticks) = 0;
            id(control_leds).execute();
            return;
          }
          bool active = id(va).is_running()
            || pending_fresh
            || id(capture_mode) != ${capture_mode_none}
            || id(timer_ringing).state
            || id(center_button).state
            || id(dial_touched)
            || media_busy;
          if (active) { id(led_idle_ticks) = 0; return; }
          id(led_idle_ticks) += 1;
          if (id(led_idle_ticks) >= 5) {
            ESP_LOGW("led_watchdog", "no activity for %ds in transient LED phase %d; returning ring to idle",
                     id(led_idle_ticks), p);
            // Clear any lingering quick-chat state so it can't leak to the next turn.
            id(quick_chat_pending) = false;
            id(quick_chat_expecting_announcement) = false;
            id(quick_chat_announcement_count) = 0;
            id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            id(led_idle_ticks) = 0;
            id(control_leds).execute();
          }

  # Long inactivity hard-reset (~10 min): belt-and-suspenders backstop to the
  # fast LED watchdog above. If NOTHING genuine has happened for ~10 minutes (no
  # VA run, no audio playback, no button/dial, no ringing timer), force the WHOLE
  # flow state back to a clean ready state -- including flags the fast watchdog
  # doesn't clear (capture_mode, awaiting_clarification, cancel_press_consumed).
  # 10 min of genuine silence == the device is idle, so this can never fire mid-
  # interaction.
  - interval: 5s
    then:
      - lambda: |-
          bool media_busy = id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING
                         || id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          bool genuine = id(va).is_running() || media_busy || id(center_button).state
                      || id(dial_touched) || id(timer_ringing).state;
          if (genuine) { id(idle_reset_ticks) = 0; return; }
          id(idle_reset_ticks) += 5;  // this interval runs every 5s
          if (id(idle_reset_ticks) >= 600) {  // ~10 minutes of genuine silence
            ESP_LOGW("idle_reset", "10 min no activity -> full reset to ready state");
            id(quick_chat_pending) = false;
            id(quick_chat_expecting_announcement) = false;
            id(quick_chat_announcement_count) = 0;
            id(awaiting_clarification) = false;
            id(capture_mode) = ${capture_mode_none};
            id(cancel_press_consumed) = false;
            id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            id(idle_reset_ticks) = 0;
            id(control_leds).execute();
          }

voice_assistant:
  id: va
  microphone:
    - microphone: i2s_mics
      channels: 0
    - microphone: i2s_mics
      channels: 1
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: |-
        ESP_LOGI("research_webhook", "voice assistant API client connected");
        id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    # NOTE: do NOT log here. This trigger fires from inside ~APIConnection() (the
    # client is being destroyed); an ESP_LOG routes to the API log-listener, which
    # dereferences the connection currently being freed -> LoadProhibited crash ->
    # reboot. Was crashing the device on every bridge restart / API drop. Just
    # stop the assistant and refresh the LEDs.
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    - lambda: |-
        if (id(capture_mode) != ${capture_mode_none}) {
          ESP_LOGW("research_webhook", "clearing capture mode %d after voice assistant error: %s", id(capture_mode), code.c_str());
          id(capture_mode) = ${capture_mode_none};
        }
        id(awaiting_clarification) = false;
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "error_cloud_expired"
  # When the voice assistant starts: Play a wake up sound, duck audio.
  on_start:
    # Make a button cancel TERMINAL. If a press just cancelled an active flow,
    # `cancel_press_consumed` is still set (it's only cleared at the top of the
    # NEXT on_press). Any run that auto-re-opens (the continue/re-listen cycle)
    # therefore gets aborted at birth, so one press lands the device idle and
    # KEEPS it idle. A deliberate new press clears the flag in on_press first, so
    # an intentional new turn is never blocked.
    - if:
        condition:
          lambda: return id(cancel_press_consumed);
        then:
          - lambda: ESP_LOGI("cancel", "auto-continue suppressed after cancel — staying idle");
          - voice_assistant.stop:
        else:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20  # Number of dB quieter; higher implies more quiet, 0 implies full volume
              duration: 0.0s         # The duration of the transition (default is no transition)
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
    - if:
        condition:
          lambda: return id(capture_mode) == ${capture_mode_research};
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "center_button_press_sound"
  on_stt_end:
    - if:
        condition:
          lambda: return id(capture_mode) == ${capture_mode_research};
        then:
          - lambda: |-
              // Long-press research: route through the clarify-capable bridge
              // path (mode=research). The bridge infers local vs cloud, asks
              // "Local, or cloud?" when unclear, then submits to research-asks
              // and plays the start confirmation. No quick_chat pending/timeout
              // (research completes asynchronously; the completion watcher
              // announces the result). voice_dispatch.h reads the clarify signal.
              id(capture_mode) = ${capture_mode_none};
              id(awaiting_clarification) = false;
              std::string transcript = x;
              ESP_LOGI("research_webhook", "research STT ended; transcript length=%u", (unsigned) transcript.size());
              if (transcript.empty()) {
                ESP_LOGW("research_webhook", "research capture had empty transcript");
                return;
              }
              // Saved so a clarify follow-up can re-route the ORIGINAL ask.
              id(clarify_orig_mode) = ${capture_mode_research};
              id(clarify_orig_text) = transcript;
              std::string body = "{\"source\":\"" + std::string(App.get_name().c_str()) +
                                 "\",\"text\":\"" + voice_dispatch::json_escape(transcript) +
                                 "\",\"mode\":\"research\",\"clarify_capable\":true}";
              voice_dispatch::quickchat_post_async("${quickchat_base}/quick-chat", body, 1500,
                                                   id(quick_chat_generation));
        # Quick Chat: single-press transcripts go to the bridge for
        # immediate LLM query + TTS playback.
        else:
          - lambda: |-
              std::string transcript = x;
              ESP_LOGI("quick_chat", "non-research STT ended; transcript length=%u", (unsigned) transcript.size());
              if (transcript.empty()) {
                ESP_LOGW("quick_chat", "quick chat had empty transcript");
                id(quick_chat_pending) = false;
                id(quick_chat_expecting_announcement) = false;
                id(quick_chat_announcement_count) = 0;
                id(awaiting_clarification) = false;
                id(capture_mode) = ${capture_mode_none};
                id(voice_assistant_phase) = ${voice_assist_error_phase_id};
                return;
              }
              // Consume the clarification flag: if set, this utterance is the
              // user's spoken local/cloud answer to a prior "Local, or cloud?".
              bool followup = id(awaiting_clarification);
              id(awaiting_clarification) = false;
              // The effective original mode. Research follow-ups arrive here too
              // (the clarify re-arm runs as a quick-chat capture), identified by
              // clarify_orig_mode == research.
              int omode_int = followup ? id(clarify_orig_mode) : id(capture_mode);
              bool is_research = (omode_int == ${capture_mode_research});
              std::string transcript_esc = voice_dispatch::json_escape(transcript);
              std::string body;
              if (is_research) {
                // Research clarify follow-up: the answer routes the ORIGINAL
                // research ask. No quick_chat pending/timeout — research is async.
                body = "{\"source\":\"" + std::string(App.get_name().c_str()) +
                       "\",\"text\":\"" + transcript_esc +
                       "\",\"mode\":\"research\",\"clarify_capable\":true,\"clarify_followup\":true" +
                       ",\"orig_text\":\"" + voice_dispatch::json_escape(id(clarify_orig_text)) + "\"}";
              } else {
                // Quick chat: purple "thinking" + 90s timeout while the bridge
                // answers. The "mode" tag tells the :6060 bridge how to dispatch:
                // direct LLM (single) vs Hermes agent (double) vs agent+camera
                // (triple). "photo":true asks for a camera still. A failure is
                // surfaced via take_quickchat_failure_gen(), polled below.
                id(quick_chat_pending) = true;
                id(quick_chat_pending_since) = millis();
                id(quick_chat_expecting_announcement) = true;
                id(quick_chat_active_generation) = id(quick_chat_generation);
                id(quick_chat_announcement_count) = 0;
                id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
                id(control_leds).execute();
                id(quick_chat_timeout).execute();
                if (followup) {
                  // Re-send the ORIGINAL question + mode/photo (saved at clarify
                  // time) so recovery doesn't depend on bridge in-memory state.
                  int om = id(clarify_orig_mode);
                  const char *omode = (om == ${capture_mode_agent} || om == ${capture_mode_agent_photo}) ? "agent" : "direct";
                  bool ophoto = (om == ${capture_mode_agent_photo});
                  body = "{\"source\":\"" + std::string(App.get_name().c_str()) +
                         "\",\"text\":\"" + transcript_esc +
                         "\",\"mode\":\"" + std::string(omode) + "\",\"clarify_capable\":true,\"clarify_followup\":true" +
                         ",\"orig_text\":\"" + voice_dispatch::json_escape(id(clarify_orig_text)) + "\"" +
                         (ophoto ? ",\"photo\":true" : "") + "}";
                } else {
                  int cm = id(capture_mode);
                  const char *mode = (cm == ${capture_mode_agent} || cm == ${capture_mode_agent_photo}) ? "agent" : "direct";
                  bool want_photo = (cm == ${capture_mode_agent_photo});
                  // Save in case the bridge asks us to clarify this question.
                  id(clarify_orig_mode) = cm;
                  id(clarify_orig_text) = transcript;
                  body = "{\"source\":\"" + std::string(App.get_name().c_str()) +
                         "\",\"text\":\"" + transcript_esc +
                         "\",\"mode\":\"" + std::string(mode) + "\",\"clarify_capable\":true" +
                         (want_photo ? ",\"photo\":true" : "") + "}";
                }
              }
              id(capture_mode) = ${capture_mode_none};
              voice_dispatch::quickchat_post_async("${quickchat_base}/quick-chat", body, 1500,
                                                   id(quick_chat_generation));
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations, except
    # quick-chat stays purple while Hermes is thinking after STT has ended.
    - if:
        condition:
          lambda: return id(quick_chat_pending);
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
        else:
          - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

debug:
  update_interval: 5s
